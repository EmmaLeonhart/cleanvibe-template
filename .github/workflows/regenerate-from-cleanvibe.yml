name: Regenerate from cleanvibe

# This repo is a forkable snapshot of the scaffold that `cleanvibe new` produces
# (https://pypi.org/project/cleanvibe/). It keeps itself current: once a day it
# checks PyPI for a newer `cleanvibe` release and, if there is one, reinstalls it,
# re-runs `cleanvibe new cleanvibe-template`, mirrors the fresh scaffold over this
# repo, and commits. `.git/`, `.github/`, and `.cleanvibe-version` are preserved
# (they are not part of the scaffold). When cleanvibe is unchanged, this is a no-op.
#
# To start a new project from this template: use "Use this template" / fork, then
# open Claude Code — the scaffold's own queue.md bootstrap walks the rest.

on:
  schedule:
    - cron: "37 6 * * *"   # daily ~06:37 UTC, off the :00 mark
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-from-cleanvibe
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check PyPI for a newer cleanvibe
        id: check
        run: |
          LATEST=$(python - <<'PY'
          import json, urllib.request
          d = json.load(urllib.request.urlopen("https://pypi.org/pypi/cleanvibe/json", timeout=30))
          print(d["info"]["version"])
          PY
          )
          CURRENT=$(cat .cleanvibe-version 2>/dev/null | tr -d '[:space:]' || true)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "cleanvibe $CURRENT -> $LATEST — will regenerate"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cleanvibe is up to date ($CURRENT) — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the scaffold with the new cleanvibe
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e
          pip install --upgrade "cleanvibe==${{ steps.check.outputs.latest }}"
          # Scaffold into a temp parent so the project name stays "cleanvibe-template"
          # (cleanvibe derives the name from the path basename).
          WORK="$(mktemp -d)"
          ( cd "$WORK" && cleanvibe new cleanvibe-template --no-claude )
          # Mirror the fresh scaffold over this repo. --delete makes it a true mirror
          # (adds new scaffold files, drops removed ones) while the excludes keep the
          # bits that are NOT part of the scaffold.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.cleanvibe-version' \
            "$WORK/cleanvibe-template/" ./
          echo "${{ steps.check.outputs.latest }}" > .cleanvibe-version
          rm -rf "$WORK"

      - name: Commit if the scaffold changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "version bumped but scaffold output identical — nothing to commit"
          else
            git commit -m "chore: regenerate scaffold from cleanvibe v${{ steps.check.outputs.latest }}"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              git fetch origin "$GITHUB_REF_NAME" || true
              git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi
